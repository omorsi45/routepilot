# RoutePilot local example: a mock upstream and a local Ollama.
#
# Start the mock upstream on 127.0.0.1:9090 and/or Ollama on 127.0.0.1:11434,
# then run: routepilot serve --config examples/config.local.yaml

# The gateway speaks plaintext HTTP, so this example binds loopback only.
# Do not change it to ":8080" or "0.0.0.0:8080" without TLS in front.
server:
  listen: "127.0.0.1:8080"

providers:
  - name: mock
    type: openaicompat
    base_url: http://127.0.0.1:9090/v1
  - name: ollama
    type: openaicompat
    base_url: http://127.0.0.1:11434/v1

models:
  - id: mock-small
    rank: 1
    context_window: 16384
    capabilities: [streaming, tools, json_object]
    input_price_per_mtok: "0.15"
    output_price_per_mtok: "0.60"
    deployments:
      - name: mock-small
        provider: mock
        upstream_model: mock-small
        max_inflight: 64
  - id: mock-large
    rank: 3
    context_window: 128000
    max_output_tokens: 16384
    capabilities: [streaming, tools, json_object, json_schema, vision]
    input_price_per_mtok: "2.50"
    output_price_per_mtok: "10.00"
    deployments:
      - name: mock-large-a
        provider: mock
        upstream_model: mock-large
        max_inflight: 64
      - name: mock-large-b
        provider: mock
        upstream_model: mock-large-b
        max_inflight: 64
  - id: qwen3-1.7b
    rank: 2
    context_window: 32768
    capabilities: [streaming]
    input_price_per_mtok: "0"
    output_price_per_mtok: "0"
    deployments:
      - name: qwen3-1.7b-ollama
        provider: ollama
        upstream_model: qwen3:1.7b
        max_inflight: 64

# "auto" picks the cheapest model that satisfies the request.
routing:
  policy: cheapest

# One row per attempt sent to a provider, in a SQLite file next to this config. Without this
# section (driver none) no database is written. routepilot reconcile compares the ledger with
# the budget counters; see its --help.
accounting:
  driver: sqlite
  sqlite_path: usage.db

# An append-only JSONL log of every routing decision and of the feedback clients send to
# POST /v1/feedback, rotated at max_bytes (default 100 MiB, at least 1 MiB). It holds no prompt text, only a
# hash prefix. Off by default; without it the feedback route does not exist.
# decision_log:
#   path: decisions.jsonl

# OpenTelemetry traces (one span per chat request, with admission, decide, budget and
# upstream.attempt children) sent to an OTLP/HTTP collector; the path /v1/traces is added when
# the URL has none. Spans carry identifiers, numbers and outcome names, never prompts or keys.
# Off by default (noop). GET /metrics serves the Prometheus series on the main listener.
# tracing:
#   otlp_endpoint: http://localhost:4318
#   sample_ratio: 1.0

tenants:
  # Only the SHA-256 of a client key is stored, never the key itself.
  # Compute a hash with:  printf %s your-key | shasum -a 256
  # This hash is for the local demo key "demo-key-local".
  - id: demo
    api_key_sha256: 8b98693f57d481139ed5b92daf7ba8b09e22e380fcd1bf02532c777ac80aa940
    allowed_models: ["*"]
    rpm: 600
    tpm: 200000
    max_concurrency: 32
