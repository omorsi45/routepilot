        provider: claude
        upstream_model: claude-haiku

tenants:
  - id: team-a
    api_key_sha256: 8b98693f57d481139ed5b92daf7ba8b09e22e380fcd1bf02532c777ac80aa940
    allowed_models: ["small"]
    max_timeout_ms: 60000
