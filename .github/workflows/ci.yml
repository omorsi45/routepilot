name: CI

# The fast lane. Everything here runs on every push to main and every pull
# request and must stay deterministic: no calls to model providers, no
# container runtime, no sleeps beyond short bounded timing tests.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests never call a provider; an accidental key in the environment would
  # make a passing run meaningless.
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  OPENROUTER_API_KEY: ""

jobs:
  build:
    name: format, vet, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -count=1 ./...

      - name: go test -race
        run: go test -race -count=1 ./...

      - name: tidy check
        run: |
          cp go.mod go.mod.orig
          if [ -f go.sum ]; then cp go.sum go.sum.orig; fi
          go mod tidy
          diff -u go.mod.orig go.mod
          if [ -f go.sum.orig ]; then diff -u go.sum.orig go.sum; fi

  python:
    name: python lint, format, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: install pinned dependencies
        run: make py-setup PYTHON_BOOTSTRAP=python

      - name: ruff and pytest
        run: make py-check
