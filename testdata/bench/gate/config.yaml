# Fixture for the replay regression gate smoke test: three invented models and one
# tenant. The replay provider is never called, and nothing here comes from the dataset.
# The rules route code prompts to the large model, long prompts to the middle one and the
# rest to the small one, so a regression in the rules policy moves the gated numbers.
providers:
  - name: replay
    type: openaicompat
    base_url: http://127.0.0.1:1/v1

models:
  - id: gate-small
    rank: 1
    context_window: 1048576
    max_output_tokens: 65536
    capabilities: [streaming]
    input_price_per_mtok: "0.100000"
    output_price_per_mtok: "0.400000"
    deployments:
      - name: gate-small-replay
        provider: replay
        upstream_model: gate-small
  - id: gate-mid
    rank: 2
    context_window: 1048576
    max_output_tokens: 65536
    capabilities: [streaming]
    input_price_per_mtok: "1.000000"
    output_price_per_mtok: "4.000000"
    deployments:
      - name: gate-mid-replay
        provider: replay
        upstream_model: gate-mid
  - id: gate-large
    rank: 3
    context_window: 1048576
    max_output_tokens: 65536
    capabilities: [streaming]
    input_price_per_mtok: "5.000000"
    output_price_per_mtok: "20.000000"
    deployments:
      - name: gate-large-replay
        provider: replay
        upstream_model: gate-large

routing:
  policy: rules
  default_model: gate-small
  rules:
    - name: code
      model: gate-large
      when:
        contains_any: ["def ", "class "]
    - name: long
      model: gate-mid
      when:
        min_prompt_bytes: 200

tenants:
  - id: replay
    api_key_sha256: cf8ff434c72b3a3a99361e47c9041fd978617260da7f0fd9b74d03bb83864b17
    allowed_models: ["*"]
    default_max_tokens: 1024
