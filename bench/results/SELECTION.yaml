# Which run of each experiment the generated docs show.
#
# docs/results.md and docs/performance.md are built from bench/results by
# bench/scripts/render_docs.py. An experiment with no entry here shows its newest run. An entry
# is a run ID and a one-line reason; `status` is one of:
#   current  shown with its tables (the first entry when `status` is left out)
#   also     shown with its tables next to the current run
#   older    listed by run ID and reason only (superseded or a different pool)
# The script fails when a run named here does not exist.

data:
  - run: "20261031T064740Z-d02bb26"
    status: current
    reason: Newest run, with per-token prices fitted on train and calibration rows only.
  - run: "20261028T004933Z-bec7b21"
    status: older
    reason: "Superseded: prices were fitted on every split; refitted on train and calibration only."
  - run: "20261028T000340Z-dc84ab7"
    status: older
    reason: Superseded. It defined the cheapest model as the one with the lowest fitted price; the newest run defines it as the lowest mean cost per item on train and calibration, as the replay charges it.

