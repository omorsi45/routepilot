failover:
  - run: "20261029T010235Z-f5ff91d"
    status: current
    reason: The mock cuts a share of A's streams after the first content chunk, so the mid-stream arm tests the no-second-call rule on many streams.
  - run: "20261028T233539Z-ee7619a"
    status: older
    reason: Superseded. Its mid-stream arm used a mock directive that cut every stream on A, so A's breaker opened after a few cuts and almost no stream tested the rule.

quota_correctness:
  - run: "20261029T010202Z-f5ff91d"
    status: current
    reason: Usage-ledger rows are written in batches off the request path, and the mock caps each answer at the request's max_tokens.
  - run: "20261028T233917Z-ee7619a"
    status: older
    reason: Superseded. First run with 64 clients, made before the usage ledger was written in batches; ledger rows were lost and the ledger checks failed.
  - run: "20261028T234039Z-ee7619a"
    status: older
    reason: Superseded. Control run of the same early code with fewer clients, made to see whether the lost ledger rows depended on concurrency.

