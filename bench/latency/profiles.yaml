    ttft_median_ms: 1005
    ttft_sigma: 0.5
    tpot_median_ms: 9.6618357
    tpot_sigma: 0.3
    source: https://artificialanalysis.ai/models/claude-4-sonnet
    retrieved: "2026-10-28"
    note: "assumed, no public figure: the page (Claude 4 Sonnet (Non-reasoning)) shows Speed N/A and no TTFT; tpot is the median of the displayed ones and ttft the median of the displayed non-reasoning TTFTs; sigma assumed"

