# Simulated latency priors for the 12 flagship pool models. Every number derived from
# this file is a simulated figure, not a measurement of RoutePilot or of the providers.
#
# Medians come from the public Artificial Analysis model pages listed in SOURCES.md,
# read on 2026-10-28 exactly as displayed:
#   tpot_median_ms = 1000 / displayed output speed (tokens per second)
#   ttft_median_ms = displayed time to first token (s) * 1000 for non-reasoning variants
# Reasoning variants use the median displayed TTFT of the non-reasoning models (1005 ms:
# the median of 0.37, 0.75, 1.26 and 1.38 s), because the page's TTFT includes hidden
# reasoning time that the recorded completion_tokens x TPOT already counts.
# A model whose page shows no value gets the median of the displayed ones.
# The sigmas (spread of the logarithm) are assumed: no page gives one.
profiles:
